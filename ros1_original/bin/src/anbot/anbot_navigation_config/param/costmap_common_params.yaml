max_obstacle_height: 0.60  # assume something like an arm is mounted on top of the robot
obstacle_range: 18
raytrace_range: 18
robot_radius: 0.4
inflation_radius: 0.4
conservative_reset_dist: 2.0

# voxel map configuration; z-voxels 0 are filled by bumpers and 1 by laser scan (kinect)
map_type: voxel
origin_z: 0.0
z_resolution: 0.2
z_voxels: 2
publish_voxel_map: false

observation_sources: scan kinect_scan

scan: {data_type: LaserScan, sensor_frame: laser, topic: scan, marking: true, clearing: true}
kinect_scan: {data_type: LaserScan, sensor_frame: camera_depth_frame, topic: kinect_scan, marking: true, clearing: true}
