
max_speed:  0.8              # 最大线速度
min_speed:  0.0               # 最小线速度
max_turn_speed: 0.8          # 最大角速度
robot_radius: 0.45            # 机器人半径,应稍大于实际机器人半径
safe_radius: 0.52             # 侧面安全距离，前方安全距离结合该值和避障前探角度得出
tolerance_distance: 0.5      # 容忍距离，即机器人离目标点小于这个距离，则认为已经到了
tolerance_yaw: 0.3          # 容忍弧度，即机器人离目标弧度小于这个值，则认为已经到了
obstacleavoid_enable: 1      #避障功能是否开启
point_get_distance: 0.3     #路径上的点到达判定距离      
obstacle_detect_front_angle: 7    #避障前探角度
limit_speed_distance: 0.40     #速度限制启动障碍距离、严禁修改！
stopTimeThreshold : 300               #300s 5min
stopDistanceThreshold : 1.5  #1 M
roy_speed_mat_iput: [0.0, 2.0, 3.0, 6.0, 10.0, 30.0, 180.0]
roy_speed_mat_oput: [0.0, 0.08, 0.15, 0.3, 0.5,  0.8,  1.0]
touch_enable: 1
line_speed_mat_iput: [0.0, 15.0, 30.0, 50, 70, 90, 110.0]
line_speed_mat_out: [1.0,  0.65,  0.45,  0.40, 0.35, 0.25, 0.0]
product_type: 3
tail_lenth: 0.45   #中心轴至尾长，前驱APV专用属性
tail_width: 0.4  #APV尾部宽度
speed_add_step: 3.0 
closure_append_dist: 0.1
robot_width: 0.8
robot_lenth: 0.8
apvs_filter_angle: 10.0
apvs_brace1_angle: -120.0        #注意，如果没有第一根柱子遮挡，则此角度应该填写与后面遮挡一致的角度，不能填写0！
apvs_brace2_angle: -120.0
apvs_brace3_angle: 120.0
apvs_brace4_angle: 120.0
ctl_delay: 0.15
fall_detect_enable: 1 
fall_detect_height: 0.2
low_detect_enable: 1 
mapping_speed_limit: 0.5
zero_speed_limit: 0.9
smallspace_autopath: 1
_u1: 0.5                  # difference between goal and robot
_u2: 0.3                 # difference current direction
_u3: 0.2
wheel_gurding_front: 0.46
wheel_gurding_back: 0.46
wheelbase: 0.46
low_turn_direct_noob: 1
