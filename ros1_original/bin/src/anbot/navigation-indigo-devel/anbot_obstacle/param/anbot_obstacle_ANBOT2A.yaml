
max_speed:  0.65              # 最大线速度
min_speed:  0.0               # 最小线速度
max_turn_speed: 0.75          # 最大角速度
robot_radius: 0.295            # 机器人超声波安装的位置半径
safe_radius: 0.45             # 侧面安全距离，前方安全距离结合该值和避障前探角度得出
tolerance_distance: 0.5      # 容忍距离，即机器人离目标点小于这个距离，则认为已经到了
tolerance_yaw: 0.3          # 容忍弧度，即机器人离目标弧度小于这个值，则认为已经到了
obstacleavoid_enable: 1      #避障功能是否开启
point_get_distance: 0.5     #路线上的路径点到达判定距离      
obstacle_detect_front_angle: 13    #避障前探角度
limit_speed_distance: 0.43     #速度限制启动障碍距离
stopTimeThreshold : 300               #300s 5min
stopDistanceThreshold : 1  #1 M
roy_speed_mat_iput: [0.0, 2.0, 3.0, 6.0, 10.0, 30.0, 50.0]
roy_speed_mat_oput: [0.0, 0.02, 0.08, 0.16, 0.26,  0.5,  1.0]
touch_enable: 1
line_speed_mat_iput: [0.0, 30.0, 90.0, 100.0, 120.0]
line_speed_mat_out: [1.0, 0.8, 0.4, 0.25, 0.0]
#line_speed_mat_iput: [0.0, 30.0, 90.0, 100.0]
#line_speed_mat_out: [1.0, 0.6, 0.2, 0.0]
product_type: 0
speed_add_step: 1.3
fall_detect_stand: 0.85
closure_append_dist: 0.1
_u1: 0.5                  # difference between goal and robot
_u2: 0.3                 # difference current direction
_u3: 0.2
