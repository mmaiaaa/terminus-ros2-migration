touch_enable: 1
line_speed_mat_iput: [0.0, 15.0, 30.0, 50, 70, 90, 110.0]
line_speed_mat_out: [1.0,  0.70,  0.55,  0.5, 0.4, 0.35, 0.0]
product_type: 3
tail_lenth: 0.4   #中心轴至尾长，前驱APV专用属性
tail_width: 0.35  #APV尾部宽度
head_lenth: 0.4
head_width: 0.35
speed_add_step: 1.4 
closure_append_dist: 0.1
robot_width: 0.8
robot_lenth: 0.9
apvs_filter_angle: 6.5
apvs_brace1_angle: -33.16
apvs_brace2_angle: -141.84
apvs_brace3_angle: 33.16
apvs_brace4_angle: 141.84
ctl_delay: 0.25
ctl_delay_roy: 0.2
fall_detect_enable: 1 
fall_detect_height: 0.2
low_detect_enable: 1 
mapping_speed_limit: 0.5
zero_speed_limit: 0.9
smallspace_autopath: 0
mw_detect_enable: 1
