
max_speed:  0.8              # 最大线速度
min_speed:  0.0               # 最小线速度
max_turn_speed: 0.8          # 最大角速度
robot_radius: 0.5            # 机器人半径,应稍大于实际机器人半径
safe_radius: 0.60             # 侧面安全距离，前方安全距离结合该值和避障前探角度得出
tolerance_distance: 0.6      # 容忍距离，即机器人离目标点小于这个距离，则认为已经到了
tolerance_yaw: 0.3          # 容忍弧度，即机器人离目标弧度小于这个值，则认为已经到了
obstacleavoid_enable: 1      #避障功能是否开启
point_get_distance: 0.5     #路径上的点到达判定距离      
obstacle_detect_front_angle: 7  #避障前探角度
limit_speed_distance: 0.58     #速度限制启动障碍距离、严禁修改！
stopTimeThreshold : 300               #300s 5min
stopDistanceThreshold : 1.5  #1 M
roy_speed_mat_iput: [0.0, 2.0, 5.0, 10.0, 30.0, 60.0, 90.0]
roy_speed_mat_oput: [0.0, 0.02, 0.05, 0.1, 0.3,  0.8,  1.0]
touch_enable: 0
line_speed_mat_iput: [0.0, 15.0, 30.0, 50, 70, 90, 100.0]
line_speed_mat_out: [1.0, 0.7, 0.55, 0.40, 0.20, 0.10, 0.0]
product_type: 1
tail_lenth: 0.55
tail_width: 0.55
head_lenth: 0.25 # 停障时在该值基础上+0.3
head_width: 0.55
speed_add_step: 0.6
closure_append_dist: 0.1
robot_width: 1.16
robot_lenth: 0.40 # 只能取头部长度的2倍
zero_speed_limit: 0.75
wheel_gurding_front: 0.42 # 轮距
ctl_delay: 0.25
ctl_delay_roy: 0.25

isOpti: true # opti
enableSonarFilter: false # 开启手臂超声过滤
left_angle_error: 10 # 左臂安装误差
right_angle_error: -10 # 右臂安装误差
arm_angle_filter: [0,-60,-130,5,-60,-130] # 左臂需要过滤的超声编号和角度范围，右臂需要过滤的超声编号和角度范围