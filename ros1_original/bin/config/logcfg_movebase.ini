log4cplus.appender.ERROR_MSG.File=/home/anbot/log/movebase_error.log
log4cplus.appender.ERROR_MSG.MaxFileSize=20MB
log4cplus.appender.ERROR_MSG.MaxBackupIndex=1
log4cplus.appender.ERROR_MSG.Append=true
log4cplus.appender.ERROR_MSG.RollOnClose=false
log4cplus.appender.ERROR_MSG.layout=log4cplus::PatternLayout
