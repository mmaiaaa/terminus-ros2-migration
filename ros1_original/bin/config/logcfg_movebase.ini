
log4cplus.rootLogger=DEBUG, DEBUG_MSG,INFO_MSG, WARN_MSG, ERROR_MSG

log4cplus.appender.DEBUG_MSG=log4cplus::RollingFileAppender
log4cplus.appender.DEBUG_MSG.Schedule=DAILY
log4cplus.appender.DEBUG_MSG.File=/home/anbot/log/movebase_debug.log

log4cplus.appender.DEBUG_MSG.MaxFileSize=300MB
log4cplus.appender.DEBUG_MSG.MaxBackupIndex=1
log4cplus.appender.DEBUG_MSG.Append=true
log4cplus.appender.DEBUG_MSG.RollOnClose=false
log4cplus.appender.DEBUG_MSG.layout=log4cplus::PatternLayout
log4cplus.appender.DEBUG_MSG.layout.ConversionPattern=%D{%Y-%m-%d %H:%M:%S,%Q} %-5p %c{2} - %m[%l]%n
log4cplus.appender.DEBUG_MSG.filters.1=log4cplus::spi::LogLevelRangeFilter
log4cplus.appender.DEBUG_MSG.filters.1.LogLevelMin=DEBUG
log4cplus.appender.DEBUG_MSG.filters.1.LogLevelMax=DEBUG

log4cplus.appender.INFO_MSG=log4cplus::RollingFileAppender
log4cplus.appender.INFO_MSG.Schedule=DAILY
log4cplus.appender.INFO_MSG.File=/home/anbot/log/movebase_info.log
