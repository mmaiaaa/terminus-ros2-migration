log4cplus.appender.INFO_MSG.filters.1=log4cplus::spi::LogLevelRangeFilter
log4cplus.appender.INFO_MSG.filters.1.LogLevelMin=INFO
log4cplus.appender.INFO_MSG.filters.1.LogLevelMax=INFO

log4cplus.appender.WARN_MSG=log4cplus::RollingFileAppender
log4cplus.appender.WARN_MSG.Schedule=DAILY
log4cplus.appender.WARN_MSG.File=/home/anbot/log/movebase_warn.log
log4cplus.appender.WARN_MSG.MaxFileSize=20MB
